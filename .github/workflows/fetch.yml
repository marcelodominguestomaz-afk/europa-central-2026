name: Coleta de dados do guia
on:
  push:
    branches: [tools]
    paths: ['tools/request.json']
permissions:
  contents: write
concurrency:
  group: fetch-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - run: python tools/fetch.py tools/request.json tools/result.json
      - name: Guardar o resultado no ramo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/result.json
          git commit -m "Resultado da coleta" || echo "Sem mudanças"
          git push
